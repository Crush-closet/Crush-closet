<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crush Closet | Luxury Collection</title>
    <style>
        :root { --gold: #D4AF37; --magenta: #C70066; --black: #111; --white: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--white); color: var(--black); padding-bottom: 150px; }
        
        .slideshow-container { 
            width: 100%; 
            position: relative; 
            background-color: #fff;
            line-height: 0;
        }
        
        .slide { 
            width: 100%; 
            height: auto; 
            display: none;
            object-fit: contain;
        }

        .inner-circle { background: var(--black); color: var(--gold); padding: 25px 20px; text-align: center; border-top: 3px solid var(--gold); }
        .inner-circle h3 { margin-bottom: 5px; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
        .handle { color: var(--magenta); font-weight: bold; }
        .insta-btn { display: inline-block; margin-top: 15px; background: var(--gold); color: #000; padding: 12px 35px; text-decoration: none; font-weight: bold; border-radius: 50px; text-transform: uppercase; font-size: 12px; }

        .filter-menu { display: flex; overflow-x: auto; background: #fff; padding: 15px; position: sticky; top: 0; z-index: 100; gap: 10px; border-bottom: 1px solid #eee; -webkit-overflow-scrolling: touch; }
        .filter-menu::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 10px 20px; border: 1px solid #ddd; background: #fff; border-radius: 25px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--black); color: #fff; border-color: var(--black); }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .product-card { border: 1px solid #f2f2f2; border-radius: 8px; overflow: hidden; display: none; flex-direction: column; background: #fff; }
        .product-image { width: 100%; height: auto; object-fit: contain; }
        .product-info { padding: 12px; text-align: center; }
        .price-tag { color: var(--magenta); font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        
        /* SIZE SELECTOR STYLE */
        .size-selector { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 10px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            font-size: 11px; 
            background: #fff;
            outline: none;
            cursor: pointer;
        }
        
        .add-btn { background: var(--black); color: white; border: none; width: 100%; padding: 14px; font-size: 11px; font-weight: bold; text-transform: uppercase; border-radius: 5px; cursor: pointer; }

        /* FOOTER / COOKIE SECTION */
        .checkout-footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #fff; 
            padding: 15px; 
            border-top: 1px solid #eee; 
            z-index: 1000; 
            text-align: center;
        }
        .cart-float { 
            width: 90%; 
            background: var(--gold); 
            color: #000; 
            padding: 18px 0; 
            border-radius: 50px; 
            font-weight: bold; 
            border: none; 
            font-size: 13px; 
            text-transform: uppercase; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .clear-cookie-btn { 
            display: block; 
            margin: 10px auto 0; 
            font-size: 10px; 
            color: #999; 
            background: none; 
            border: none; 
            text-decoration: underline; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <div class="slideshow-container" id="slideshow">
        <img class="slide" src="hero1.jpg" onerror="this.src='hero1.png';">
        <img class="slide" src="hero2.jpg" onerror="this.src='hero2.png';">
        <img class="slide" src="hero3.jpg" onerror="this.src='hero3.png';">
        <img class="slide" src="hero4.jpg" onerror="this.src='hero4.png';">
    </div>

    <div class="inner-circle">
        <h3>JOIN THE INNER CIRCLE</h3>
        <p>Follow <span class="handle">@crush_closet_ja</span></p>
        <a href="https://instagram.com/crush_closet_ja" class="insta-btn" target="_blank">Follow Instagram</a>
    </div>

    <div class="filter-menu">
        <button class="filter-btn active" onclick="showCategory('bikini', this)">Bikinis</button>
        <button class="filter-btn" onclick="showCategory('dress', this)">Dresses</button>
        <button class="filter-btn" onclick="showCategory('shirt', this)">Shirts</button>
        <button class="filter-btn" onclick="showCategory('cologne', this)">Cologne</button>
        <button class="filter-btn" onclick="showCategory('bracelet', this)">Bracelets</button>
        <button class="filter-btn" onclick="showCategory('lipstick', this)">Lipstick</button>
    </div>

    <div id="product-display" class="product-grid"></div>

    <div class="checkout-footer">
        <button class="cart-float" onclick="checkoutWhatsApp()">
            Checkout via WhatsApp (<span id="cart-count">0</span>)
        </button>
        <button class="clear-cookie-btn" onclick="clearCart()">Clear Bag / Reset Cookies</button>
    </div>

    <script>
        // Uses localStorage (cookies) to remember items
        let cart = JSON.parse(localStorage.getItem('rk_cart')) || [];
        let slideIndex = 0;

        const inventory = {
            'bikini': { prefix: 'bikini', label: 'Bikini', prices: ["5,500", "5,500"], sizes: ["S", "M", "L", "XL"] },
            'dress': { prefix: 'dress', label: 'Dress', prices: ["7,500", "7,500"], sizes: ["S", "M", "L"] },
            'shirt': { prefix: 'shirt', label: 'Shirt', prices: ["4,500", "4,500"], sizes: ["S", "M", "L", "XL", "XXL"] },
            'cologne': { prefix: 'cologne', label: 'Cologne', prices: ["12,000", "15,000"], sizes: ["Standard"] },
            'bracelet': { prefix: 'bracelet', label: 'Bracelet', prices: ["2,500", "3,000"], sizes: ["One Size"] },
            'lipstick': { prefix: 'lipstick', label: 'Lipstick', prices: ["1,800", "2,200"], sizes: ["Standard"] }
        };

        function startSlideshow() {
            let slides = document.querySelectorAll(".slide");
            slides.forEach(s => s.style.display = "none");
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}
            if(slides[slideIndex-1]) slides[slideIndex-1].style.display = "block";
            setTimeout(startSlideshow, 4000);
        }

        function showCategory(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const container = document.getElementById('product-display');
            container.innerHTML = '';
            const data = inventory[category];

            for (let i = 1; i <= 50; i++) {
                const card = document.createElement('div');
                card.className = 'product-card';
                const price = data.prices[i-1] || data.prices[0];

                // Create size options
                let sizeOptions = data.sizes.map(s => `<option value="${s}">${s}</option>`).join('');

                card.innerHTML = `
                    <img src="${data.prefix}${i}.png" class="product-image" 
                         onerror="this.src='${data.prefix}${i}.jpg'; this.onerror=function(){this.closest('.product-card').remove();}" 
                         onload="this.closest('.product-card').style.display='flex'">
                    <div class="product-info">
                        <div class="price-tag">$${price} JMD</div>
                        <select class="size-selector" id="size-${category}-${i}">
                            <option value="">Select Size</option>
                            ${sizeOptions}
                        </select>
                        <button class="add-btn" onclick="addToCart('${data.label} #${i}', '${price}', '${category}', ${i})">Add to Bag</button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function addToCart(item, price, category, index) {
            const sizeDropdown = document.getElementById(`size-${category}-${index}`);
            const selectedSize = sizeDropdown.value;

            if(!selectedSize) {
                alert("Please select a size before adding to bag!");
                return;
            }

            cart.push(`${item} (Size: ${selectedSize}) - $${price}`);
            localStorage.setItem('rk_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function clearCart() {
            if(confirm("Are you sure you want to clear your bag?")) {
                cart = [];
                localStorage.removeItem('rk_cart');
                updateCartUI();
            }
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert("Your bag is empty!");
            let msg = "Hello Crush Closet! 👑 I want to order: \n\n" + cart.join("\n");
            window.open("https://wa.me/18763047407?text=" + encodeURIComponent(msg));
        }

        window.onload = () => {
            startSlideshow();
            showCategory('bikini', document.querySelector('.filter-btn.active'));
            updateCartUI();
        };
    </script>
</body>
</html>
